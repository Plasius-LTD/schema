name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  actions: read
  contents: read

jobs:
  trusted_head:
    name: Trusted head admission
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject external fork execution
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPOSITORY}" != "${BASE_REPOSITORY}" ]; then
            echo "External fork pull requests cannot be merged until a maintainer moves the reviewed commit to a repository-owned branch." >&2
            exit 1
          fi

  build-test:
    needs: trusted_head
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Verify private artifact policy
        run: npm run privacy:check

      - name: Test private artifact policy
        run: npm run test:privacy

      - name: Install deps
        run: npm ci --no-fund --no-audit --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Security audit (runtime deps)
        run: npm run audit:npm

      - name: Build
        run: npm run build --if-present

      - name: Verify public package contents
        run: npm run pack:check

      - name: Test with coverage
        run: |
          set -euo pipefail

          if node -e "const s=(require('./package.json').scripts||{})['test:coverage']||''; process.exit(s.includes('vitest') ? 0 : 1)"; then
            npm run test:coverage -- --coverage.reporter=lcov --coverage.reporter=text-summary
          elif node -e "const s=(require('./package.json').scripts||{})['test:coverage']||''; process.exit(s ? 0 : 1)"; then
            npm run test:coverage
          elif node -e "const s=(require('./package.json').scripts||{}).test||''; process.exit(s.includes('vitest') ? 0 : 1)"; then
            npm run test -- --coverage --coverage.reporter=lcov --coverage.reporter=text-summary
          else
            npm run test -- --coverage
          fi

      - name: Locate coverage report
        run: |
          set -euo pipefail
          LCOV_FILE="$(find coverage -type f -name lcov.info | head -n 1 || true)"
          if [ -z "$LCOV_FILE" ]; then
            echo "No lcov.info found under coverage/."
            exit 1
          fi
          echo "Using coverage report: $LCOV_FILE"
          echo "LCOV_FILE=$LCOV_FILE" >> "$GITHUB_ENV"

      - name: Enforce line coverage >= 80%
        run: |
          set -euo pipefail
          if [ -z "${LCOV_FILE:-}" ] || [ ! -f "$LCOV_FILE" ]; then
            echo "Missing coverage report: ${LCOV_FILE:-unset}"
            exit 1
          fi

          read -r LF LH <<EOF
          $(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "%d %d\n", lf+0, lh+0}' "$LCOV_FILE")
          EOF

          if [ "$LF" -le 0 ]; then
            echo "Invalid coverage totals (LF=$LF, LH=$LH)"
            exit 1
          fi

          PCT=$(awk -v lh="$LH" -v lf="$LF" 'BEGIN{printf "%.2f", (lh/lf)*100}')
          echo "Line coverage: ${PCT}% (${LH}/${LF})"

          awk -v pct="$PCT" 'BEGIN{exit(pct >= 80 ? 0 : 1)}' || {
            echo "Coverage gate failed: ${PCT}% < 80%"
            exit 1
          }

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.LCOV_FILE }}
          flags: unittests
          fail_ci_if_error: false
          slug: ${{ github.repository }}

  # BEGIN PLASIUS PUBLIC ARTIFACT INTEGRITY JOB
  public_artifact_integrity:
    name: Public artifact integrity
    needs: trusted_head
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted","Linux","X64"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify public artifact integrity
        run: node ./scripts/verify-private-artifacts.cjs
  # END PLASIUS PUBLIC ARTIFACT INTEGRITY JOB
